<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary SEO Meta Tags -->
    <title>JKmall - Kenya's #1 Online Shopping Platform | Fast Boda-Boda Delivery</title>
    <meta name="description" content="Shop electronics, fashion, groceries & more on JKmall. Pay securely via M-Pesa and enjoy fast boda-boda delivery across Nairobi. Best prices guaranteed!" />
    <meta name="keywords" content="online shopping Kenya, Nairobi delivery, M-Pesa shopping, boda-boda delivery, electronics Kenya, fashion Nairobi, JKmall, e-commerce Kenya" />
    <meta name="author" content="JKmall" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://jkmall.co.ke/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://jkmall.co.ke/" />
    <meta property="og:title" content="JKmall - Kenya's Fastest Online Shopping Platform" />
    <meta property="og:description" content="Shop from top brands, pay via M-Pesa, and get fast boda-boda delivery in Nairobi. Thousands of products at unbeatable prices!" />
    <meta property="og:image" content="https://jkmall.co.ke/og-image.jpg" />
    <meta property="og:site_name" content="JKmall" />
    <meta property="og:locale" content="en_KE" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://jkmall.co.ke/" />
    <meta name="twitter:title" content="JKmall - Shop & Get Delivered Fast in Nairobi" />
    <meta name="twitter:description" content="Kenya's fastest e-commerce platform. M-Pesa payments, boda-boda delivery, best prices." />
    <meta name="twitter:image" content="https://jkmall.co.ke/og-image.jpg" />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "JKmall",
      "url": "https://jkmall.co.ke",
      "description": "Kenya's fastest e-commerce platform with M-Pesa payments and boda-boda delivery",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://jkmall.co.ke/?search={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "JKmall",
      "url": "https://jkmall.co.ke",
      "logo": "https://jkmall.co.ke/logo.png",
      "contactPoint": {
        "@type": "ContactPoint",
        "telephone": "+254712345678",
        "contactType": "customer service",
        "areaServed": "KE",
        "availableLanguage": ["English", "Swahili"]
      },
      "sameAs": [
        "https://www.facebook.com/jkmall",
        "https://www.instagram.com/jkmall",
        "https://twitter.com/jkmall"
      ]
    }
    </script>

    <!-- Performance & Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#00a65a" />
    <meta name="msapplication-TileColor" content="#00a65a" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
